[workspace]
resolver = "2"
members = [
    "crates/core-protocol",
    "crates/hyprland-client",
    "crates/linux-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Controid Contributors"]

[workspace.dependencies]
anyhow = "1.0"
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
dirs = "6.0"
futures = "0.3"
hex = "0.4"
ksni = "0.3"
libc = "0.2"
nix = { version = "0.31", features = ["fs", "ioctl", "user"] }
rand = "0.9"
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
udev = "0.9"
uuid = { version = "1.24", features = ["v4"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = "0.3"
wl-clipboard-rs = "0.9"
x11rb = { version = "0.13", features = ["xfixes"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
